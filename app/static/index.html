<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnCare AI 상담</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fa;
      }

      h1 {
        text-align: center;
      }

      #chat {
        background: white;
        min-height: 400px;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      .message {
        margin: 12px 0;
        padding: 12px;
        border-radius: 10px;
      }

      .user {
        background: #e7f1ff;
        text-align: right;
      }

      .ai {
        background: #eeeeee;
      }

      .recommendation {
        background: #eef7ee;
        border: 1px solid #cde5cd;
      }

      .recommendation ul {
        margin: 8px 0;
        padding-left: 20px;
      }

      .recommendation .sources {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
      }

      .recommendation .review-note {
        font-size: 12px;
        color: #b45309;
        margin-top: 4px;
      }

      .input-area {
        display: flex;
        gap: 10px;
      }

      #messageInput {
        flex: 1;
        padding: 12px;
        font-size: 16px;
      }

      button {
        padding: 12px 20px;
        cursor: pointer;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .loading-dot {
        width: 7px;
        height: 7px;
        background: #777;
        border-radius: 50%;
        animation: blink 1.4s infinite both;
      }

      .loading-dot:nth-child(3) {
        animation-delay: 0.2s;
      }

      .loading-dot:nth-child(4) {
        animation-delay: 0.4s;
      }

      .post-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .post-actions button {
        border: none;
        border-radius: 8px;
      }

      .continue-button {
        background: #2563eb;
        color: white;
      }

      .finish-button {
        background: #e5e7eb;
        color: #333;
      }

      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }

        40% {
          opacity: 1;
        }
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #messageInput:disabled {
        background: #f0f0f0;
      }
    </style>
  </head>

  <body>
    <h1>OnCare</h1>
    <p style="text-align: center">
      AI 기반 성남형 복지연계 상담
    </p>

    <div id="chat">
      <div class="message ai">
        안녕하세요. 현재 돌봄이 필요한 상황을 편하게 말씀해주세요.
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="상황을 입력해주세요."
      />

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        전송
      </button>
    </div>

    <script>
      let currentSituation = null;

      // "잘 모르겠어요"라고 답한 필드 기억
      let currentUnknownFields = [];

      // 최종적으로 상담 종료 버튼을 눌렀는지
      let consultationFinished = false;

      // 추천 판정까지 끝났는지
      let recommendationCompleted = false;

      let isLoading = false;

      const STATUS_LABELS = {
        POTENTIAL_MATCH: "추천 가능성 높음",
        NEEDS_CHECK: "추가 확인 필요",
        LIKELY_NOT_MATCH: "조건 불일치 가능성 높음",
        OFFICIAL_ASSESSMENT_REQUIRED: "기관 판단 필요",
      };


      function setLoadingState(loading) {
        const input =
          document.getElementById("messageInput");

        const button =
          document.getElementById("sendButton");

        isLoading = loading;

        input.disabled = loading;
        button.disabled = loading;

        if (loading) {
          button.textContent = "처리 중...";
        } else {
          button.textContent = "전송";

          if (!consultationFinished) {
            input.focus();
          }
        }
      }


      function setInputEnabled(enabled) {
        const input =
          document.getElementById("messageInput");

        const button =
          document.getElementById("sendButton");

        input.disabled = !enabled;
        button.disabled = !enabled;

        if (enabled) {
          input.focus();
        }
      }


      function showLoading() {
        const chat =
          document.getElementById("chat");

        const div =
          document.createElement("div");

        div.className = "message ai loading";
        div.id = "loadingMessage";

        div.innerHTML = `
          <span>OnCare가 답변을 준비하고 있어요</span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        `;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }


      function hideLoading() {
        const loading =
          document.getElementById("loadingMessage");

        if (loading) {
          loading.remove();
        }
      }


      async function sendMessage() {
        const input =
          document.getElementById("messageInput");

        const message =
          input.value.trim();

        if (
          !message ||
          consultationFinished ||
          recommendationCompleted ||
          isLoading
        ) {
          return;
        }

        addMessage(message, "user");

        input.value = "";

        setLoadingState(true);
        showLoading();

        try {
          let response;

          // 첫 상담
          if (currentSituation === null) {
            response = await fetch(
              "/consultation/start",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  message: message,
                }),
              },
            );
          }

          // 추가질문 상담
          else {
            response = await fetch(
              "/consultation/continue",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  situation: currentSituation,
                  message: message,
                  unknown_fields:
                    currentUnknownFields,
                }),
              },
            );
          }

          if (!response.ok) {
            throw new Error(
              "상담 요청에 실패했습니다.",
            );
          }

          const data =
            await response.json();

          hideLoading();
          setLoadingState(false);

          currentSituation =
            data.situation;

          currentUnknownFields =
            data.unknown_fields || [];

          // 상담 정보가 충분하면 추천 실행
          if (data.ready_for_recommendation) {
            addMessage(
              "필요한 정보 확인이 완료되었습니다. 맞춤 복지서비스를 찾아볼게요.",
              "ai",
            );

            // 여기서 상담을 종료하지 않는다.
            await fetchRecommendation();
          }

          else {
            addMessage(
              data.next_question,
              "ai",
            );
          }
        }

        catch (error) {
          hideLoading();
          setLoadingState(false);

          console.error(error);

          addMessage(
            "상담 처리 중 오류가 발생했습니다.",
            "ai",
          );
        }
      }


      // B 파트 추천 API 호출
      async function fetchRecommendation() {
        setLoadingState(true);
        showLoading();

        try {
          const response = await fetch(
            "/recommendations",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                situation: currentSituation,
              }),
            },
          );

          if (!response.ok) {
            throw new Error(
              "추천 요청에 실패했습니다.",
            );
          }

          const result =
            await response.json();

          hideLoading();
          setLoadingState(false);

          renderRecommendation(result);

          // 추천 판정 완료
          recommendationCompleted = true;

          // 바로 종료하지 않고 사용자에게 확인
          showPostRecommendationQuestion();
        }

        catch (error) {
          hideLoading();
          setLoadingState(false);

          console.error(error);

          addMessage(
            "추천 처리 중 오류가 발생했습니다.",
            "ai",
          );
        }
      }


      function renderRecommendation(result) {
        const chat =
          document.getElementById("chat");

        const div =
          document.createElement("div");

        div.className =
          "message ai recommendation";

        const servicesHtml =
          result.matched_services.length
            ? result.matched_services
                .map(
                  (service) =>
                    `<li>${service.name}</li>`,
                )
                .join("")
            : `
                <li>
                  조건에 맞는 서비스를
                  아직 특정하지 못했습니다.
                </li>
              `;

        const sourcesHtml =
          result.source_ids.length
            ? `
                <p class="sources">
                  출처:
                  ${result.source_ids.join(", ")}
                </p>
              `
            : "";

        const reviewNote =
          result.institution_review_required
            ? `
                <p class="review-note">
                  ※ 최종 대상 여부는
                  행정복지센터의 선정조사를
                  통해 확정됩니다.
                </p>
              `
            : "";

        div.innerHTML = `
          <p>
            <strong>
              판정 결과:
              ${
                STATUS_LABELS[result.status]
                || result.status
              }
            </strong>
          </p>

          <p>${result.reason}</p>

          <ul>
            ${servicesHtml}
          </ul>

          ${sourcesHtml}

          ${reviewNote}
        `;

        chat.appendChild(div);

        chat.scrollTop =
          chat.scrollHeight;
      }


      function showPostRecommendationQuestion() {
        const chat =
          document.getElementById("chat");

        const div =
          document.createElement("div");

        div.className = "message ai";

        div.innerHTML = `
          <p>
            추천 결과를 확인했습니다.
            추가로 궁금한 점이 있으신가요?
          </p>

          <div class="post-actions">

            <button
              class="continue-button"
              onclick="continueAfterRecommendation()"
            >
              추가 상담하기
            </button>

            <button
              class="finish-button"
              onclick="finishConsultation()"
            >
              상담 종료
            </button>

          </div>
        `;

        chat.appendChild(div);

        // 사용자가 선택할 때까지 입력 잠금
        setInputEnabled(false);

        chat.scrollTop =
          chat.scrollHeight;
      }


      function continueAfterRecommendation() {
        recommendationCompleted = false;
        consultationFinished = false;

        /*
          현재 구조에서는 판정 이후 입력을
          /consultation/continue로 다시 보내면
          ready_for_recommendation이 다시 발생할 수 있다.

          따라서 추가 상담은 새로운 상담 건으로 시작한다.
        */

        currentSituation = null;
        currentUnknownFields = [];

        addMessage(
          "네. 추가로 궁금하거나 도움이 필요한 상황을 편하게 말씀해주세요.",
          "ai",
        );

        setInputEnabled(true);
      }


      function finishConsultation() {
        consultationFinished = true;
        recommendationCompleted = true;

        addMessage(
          "상담이 종료되었습니다. OnCare를 이용해주셔서 감사합니다.",
          "ai",
        );

        const input =
          document.getElementById("messageInput");

        input.value = "";
        input.placeholder =
          "상담이 종료되었습니다.";

        setInputEnabled(false);
      }


      function addMessage(text, type) {
        const chat =
          document.getElementById("chat");

        const div =
          document.createElement("div");

        div.className =
          `message ${type}`;

        div.textContent = text;

        chat.appendChild(div);

        chat.scrollTop =
          chat.scrollHeight;
      }


      document
        .getElementById("messageInput")
        .addEventListener(
          "keydown",
          function (event) {
            if (event.key === "Enter") {
              sendMessage();
            }
          },
        );
    </script>
  </body>
</html>
