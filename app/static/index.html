<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnCare AI 상담</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fa;
      }

      h1 {
        text-align: center;
      }

      #chat {
        background: white;
        min-height: 400px;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      .message {
        margin: 12px 0;
        padding: 12px;
        border-radius: 10px;
      }

      .user {
        background: #e7f1ff;
        text-align: right;
      }

      .ai {
        background: #eeeeee;
      }

      .recommendation {
        background: #eef7ee;
        border: 1px solid #cde5cd;
      }

      .recommendation ul {
        margin: 8px 0;
        padding-left: 20px;
      }

      .recommendation .sources {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
      }

      .recommendation .review-note {
        font-size: 12px;
        color: #b45309;
        margin-top: 4px;
      }

      .input-area {
        display: flex;
        gap: 10px;
      }

      #messageInput {
        flex: 1;
        padding: 12px;
        font-size: 16px;
      }

      button {
        padding: 12px 20px;
        cursor: pointer;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .loading-dot {
        width: 7px;
        height: 7px;
        background: #777;
        border-radius: 50%;
        animation: blink 1.4s infinite both;
      }

      .loading-dot:nth-child(3) {
        animation-delay: 0.2s;
      }

      .loading-dot:nth-child(4) {
        animation-delay: 0.4s;
      }

      .post-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .post-actions button {
        border: none;
        border-radius: 8px;
      }

      .continue-button {
        background: #2563eb;
        color: white;
      }

      .finish-button {
        background: #e5e7eb;
        color: #333;
      }

      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }

        40% {
          opacity: 1;
        }
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #messageInput:disabled {
        background: #f0f0f0;
      }

      #finishButton {
        background: #e5e7eb;
        color: #333;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }

      #finishButton:hover {
        background: #d1d5db;
      }
    </style>
  </head>

  <body>
    <h1>OnCare</h1>
    <p style="text-align: center">AI 기반 성남형 복지연계 상담</p>

    <div id="chat">
      <div class="message ai">
        안녕하세요. 현재 돌봄이 필요한 상황을 편하게 말씀해주세요.
      </div>
    </div>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="상황을 입력해주세요." />

      <button id="sendButton" onclick="sendMessage()">전송</button>

      <button id="finishButton" onclick="finishConsultation()">
        상담 종료
      </button>
    </div>

    <script>
      let currentSituation = null;

      // "잘 모르겠어요"라고 답한 필드 기억
      let currentUnknownFields = [];

      // 현재 추천 결과 기억
      let currentRecommendation = null;

      // 판정 이후 추가 상담 모드인지
      let postRecommendationMode = false;

      // 상담 종료 전까지 대화내용 기억
      let conversationHistory = [];

      // 최종적으로 상담 종료 버튼을 눌렀는지
      let consultationFinished = false;

      // 추천 판정까지 끝났는지
      let recommendationCompleted = false;

      let isLoading = false;

      const STATUS_LABELS = {
        POTENTIAL_MATCH: "추천 가능성 높음",
        NEEDS_CHECK: "추가 확인 필요",
        LIKELY_NOT_MATCH: "조건 불일치 가능성 높음",
        OFFICIAL_ASSESSMENT_REQUIRED: "기관 판단 필요",
      };

      function setLoadingState(loading) {
        const input = document.getElementById("messageInput");

        const button = document.getElementById("sendButton");

        isLoading = loading;

        input.disabled = loading;
        button.disabled = loading;

        if (loading) {
          button.textContent = "처리 중...";
        } else {
          button.textContent = "전송";

          if (!consultationFinished) {
            input.focus();
          }
        }
      }

      function setInputEnabled(enabled) {
        const input = document.getElementById("messageInput");

        const button = document.getElementById("sendButton");

        input.disabled = !enabled;
        button.disabled = !enabled;

        if (enabled) {
          input.focus();
        }
      }

      function showLoading() {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");

        div.className = "message ai loading";
        div.id = "loadingMessage";

        div.innerHTML = `
          <span>OnCare가 답변을 준비하고 있어요</span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        `;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function hideLoading() {
        const loading = document.getElementById("loadingMessage");

        if (loading) {
          loading.remove();
        }
      }

      async function sendMessage() {
        const input = document.getElementById("messageInput");

        const message = input.value.trim();

        if (
          !message ||
          consultationFinished ||
          recommendationCompleted ||
          isLoading
        ) {
          return;
        }

        // 현재 메시지를 넣기 전까지의 대화 기록
        const previousHistory = [...conversationHistory];

        addMessage(message, "user");
        input.value = "";

        setLoadingState(true);
        showLoading();

        try {
          let response;

          // 추천 판정 이후 추가 상담
          if (postRecommendationMode) {
            response = await fetch("/consultation/follow-up", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                situation: currentSituation,
                recommendation: currentRecommendation,
                message: message,
                conversation_history: previousHistory,
              }),
            });

            if (!response.ok) {
              throw new Error("후속 상담 요청에 실패했습니다.");
            }

            const data = await response.json();

            hideLoading();
            setLoadingState(false);

            addMessage(data.answer, "ai");

            return;
          }

          // 첫 상담
          if (currentSituation === null) {
            response = await fetch("/consultation/start", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                message: message,
              }),
            });
          }

          // 추가질문 상담
          else {
            response = await fetch("/consultation/continue", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                situation: currentSituation,
                message: message,
                unknown_fields: currentUnknownFields,
              }),
            });
          }

          if (!response.ok) {
            throw new Error("상담 요청에 실패했습니다.");
          }

          const data = await response.json();

          hideLoading();
          setLoadingState(false);

          currentSituation = data.situation;

          currentUnknownFields = data.unknown_fields || [];

          // 상담 정보가 충분하면 추천 실행
          if (data.ready_for_recommendation) {
            addMessage(
              "필요한 정보 확인이 완료되었습니다. 맞춤 복지서비스를 찾아볼게요.",
              "ai",
            );

            // 여기서 상담을 종료하지 않는다.
            await fetchRecommendation();
          } else {
            addMessage(data.next_question, "ai");
          }
        } catch (error) {
          hideLoading();
          setLoadingState(false);

          console.error(error);

          addMessage("상담 처리 중 오류가 발생했습니다.", "ai");
        }
      }

      // B 파트 추천 API 호출
      async function fetchRecommendation() {
        setLoadingState(true);
        showLoading();

        try {
          const response = await fetch("/recommendations", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              situation: currentSituation,
            }),
          });

          if (!response.ok) {
            throw new Error("추천 요청에 실패했습니다.");
          }

          const result = await response.json();

          currentRecommendation = result;
          hideLoading();
          setLoadingState(false);

          renderRecommendation(result);

          // 추천 판정 완료
          recommendationCompleted = true;
          postRecommendationMode = false;

          // 바로 종료하지 않고 사용자에게 확인
          showPostRecommendationQuestion();
        } catch (error) {
          hideLoading();
          setLoadingState(false);

          console.error(error);

          addMessage("추천 처리 중 오류가 발생했습니다.", "ai");
        }
      }

      function renderRecommendation(result) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");

        div.className = "message ai recommendation";

        const servicesHtml = result.matched_services.length
          ? result.matched_services
              .map((service) => `<li>${service.name}</li>`)
              .join("")
          : `
                <li>
                  조건에 맞는 서비스를
                  아직 특정하지 못했습니다.
                </li>
              `;

        const sourcesHtml = result.source_ids.length
          ? `
                <p class="sources">
                  출처:
                  ${result.source_ids.join(", ")}
                </p>
              `
          : "";

        const reviewNote = result.institution_review_required
          ? `
                <p class="review-note">
                  ※ 최종 대상 여부는
                  행정복지센터의 선정조사를
                  통해 확정됩니다.
                </p>
              `
          : "";

        div.innerHTML = `
          <p>
            <strong>
              판정 결과:
              ${STATUS_LABELS[result.status] || result.status}
            </strong>
          </p>

          <p>${result.reason}</p>

          <ul>
            ${servicesHtml}
          </ul>

          ${sourcesHtml}

          ${reviewNote}
        `;

        chat.appendChild(div);

        chat.scrollTop = chat.scrollHeight;
      }

      function showPostRecommendationQuestion() {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");

        div.className = "message ai";

        div.innerHTML = `
          <p>
            추천 결과를 확인했습니다.
            추가로 궁금한 점이 있으신가요?
          </p>

          <div class="post-actions">
  <button
    class="continue-button"
    onclick="continueAfterRecommendation()"
  >
    추가 상담하기
  </button>
</div>
        `;

        chat.appendChild(div);

        // 사용자가 선택할 때까지 입력 잠금
        setInputEnabled(false);

        chat.scrollTop = chat.scrollHeight;
      }

      function continueAfterRecommendation() {
        recommendationCompleted = false;
        postRecommendationMode = true;

        // 기존 상담 정보는 절대 초기화하지 않는다.
        // currentSituation 유지
        // currentUnknownFields 유지
        // currentRecommendation 유지
        // conversationHistory 유지

        // 추가 상담 버튼 중복 클릭 방지
        document.querySelectorAll(".continue-button").forEach((button) => {
          button.disabled = true;
        });

        addMessage(
          "네. 지금까지의 상담 내용을 유지하고 있어요. 추가로 궁금한 점을 말씀해주세요.",
          "ai",
        );

        setInputEnabled(true);
      }

      function finishConsultation() {
        // 이미 종료된 상담이면 아무것도 하지 않음
        if (consultationFinished) {
          return;
        }

        consultationFinished = true;
        recommendationCompleted = true;

        addMessage(
          "상담이 종료되었습니다. OnCare를 이용해주셔서 감사합니다.",
          "ai",
        );

        const input = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const finishButton = document.getElementById("finishButton");

        input.value = "";
        input.placeholder = "상담이 종료되었습니다.";

        input.disabled = true;
        sendButton.disabled = true;
        finishButton.disabled = true;
      }

      function addMessage(text, type) {
        const chat = document.getElementById("chat");

        const div = document.createElement("div");

        div.className = `message ${type}`;

        div.textContent = text;

        chat.appendChild(div);

        chat.scrollTop = chat.scrollHeight;

        conversationHistory.push({
          role: type === "user" ? "user" : "assistant",
          content: text,
        });
      }

      document
        .getElementById("messageInput")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            sendMessage();
          }
        });
    </script>
  </body>
</html>
